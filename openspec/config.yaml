schema: spec-driven

context: |
  DistanceTogether is a private room for two people in a long-distance relationship.
  The first slice is two characters moving in one room. One person starts and shares a link. A third person is refused.
  Monorepo. Backend is .NET 10 and ASP.NET Core's WebSocket, not SignalR.
  Projects: DistanceTogether.Room (engine), DistanceTogether.Server (session and socket), DistanceTogether.Room.Tests (xUnit).
  The room type is DistanceTogether.Room. Tests use the namespace DistanceTogether.Tests.
  Frontend is Vite and TypeScript: a canvas, keyboard, and a thumb control, using the browser WebSocket.
  In development, Vite proxies the socket to Kestrel.
  Architecture is volatility decomposition and Clean Architecture. The engine has no sockets, web framework, or database. The session owns the clock and the sockets and calls Room.Tick.
  Movement: seats A and B start at (240, 160), speed is 160 pixels per second, the floor is 480 by 320, direction components are from -1 to 1, and Tick takes elapsed seconds.
  Tests come before the behavior they name. One small chunk at a time. Do not commit or push unless asked.

rules:
  proposal:
    - State what this change includes and what stays later.
  specs:
    - Describe observable behavior, including the numbers a test will assert.
  design:
    - Name which type owns each step. Dependencies point at the engine.
  tasks:
    - Order each task as a failing test, then the code that makes that test pass.
