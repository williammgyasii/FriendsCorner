name: Terraform CD

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/terraform-ci.yml
    secrets: inherit

  apply:
    needs: ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - run: terraform init -input=false
      - run: terraform plan -input=false -no-color -lock-timeout=2m -out=apply.tfplan
      - run: terraform apply -input=false -no-color apply.tfplan
