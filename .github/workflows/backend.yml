name: Backend

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'edge/**'
      - '.github/workflows/backend.yml'
  workflow_call:
    inputs:
      deploy:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: friends
          POSTGRES_PASSWORD: friends
          POSTGRES_DB: friends_corner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U friends"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Key=value form: a postgres:// URL would force SSL, which this container does not serve.
      ConnectionStrings__FriendsCorner: Host=localhost;Port=5432;Username=friends;Password=friends;Database=friends_corner
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test backend/FriendsCorner.slnx
      - name: Container image builds
        run: docker build --platform linux/amd64 backend

  # One npm package holds both Workers, so its tests run here and in frontend.yml.
  edge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: edge/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  deploy:
    needs: [test, edge]
    if: inputs.deploy
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: edge/package-lock.json
      - run: npm ci
      - run: npm run deploy:api
